name: Package

# Artifacts are built where they can be built, which for Windows means on
# Windows. `cargo xwin check` type-checks the workspace for
# x86_64-pc-windows-msvc from a Mac and CI runs it on every push — but
# *linking* pulls in whisper.cpp's and llama.cpp's static libraries, which
# have to be compiled for the target. That is a real limit rather than a
# missing flag, and it is why this job exists instead of a cross-build
# script somebody would run locally and be surprised by.
#
# Unsigned unless the signing secrets are present. A fork, or this
# repository before its certificates exist, gets working unsigned artifacts
# and a log line saying so — never something that looks signed and is not.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No `version:` here. The root package.json carries `packageManager`,
      # and specifying both is an error rather than a redundancy — the
      # action refuses with ERR_PNPM_BAD_PM_VERSION. One source of truth,
      # and it is the manifest. (CI learned this in M2; this job relearned
      # it on its first run.)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The Core and the Summary sidecar. Both ship inside the bundle: the
      # Core is the process that records and runs at login without a window,
      # so an installer carrying only the Client would install a UI for a
      # product that is not there.
      - name: Build the Core and the sidecar
        run: cargo build --release -p evertranscript -p evertranscript-summarizer

      - name: Stage the binaries
        shell: bash
        run: |
          mkdir -p packaging/out
          suffix=""
          [[ "${{ runner.os }}" == "Windows" ]] && suffix=".exe"
          cp "target/release/evertranscript${suffix}" packaging/out/
          cp "target/release/evertranscript-summarizer${suffix}" packaging/out/

      - name: Build the Client
        run: |
          pnpm install --frozen-lockfile
          pnpm -C clients/electron build

      # **An absent GitHub secret is an empty string, not an unset variable**,
      # and electron-builder reads an empty CSC_LINK as a path to a
      # certificate file — then fails with "not a file" naming the project
      # directory. Building unsigned locally worked precisely because the
      # variable was genuinely unset there. So the signing vars are exported
      # only when they have content, and a repository without certificates
      # gets the unsigned path this job promises rather than a failure that
      # looks like a packaging bug.
      - name: Signing credentials, if there are any
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          carry() {
            # $1 = the name electron-builder reads, $2 = the secret's value
            if [[ -n "${2:-}" ]]; then
              echo "$1=$2" >> "$GITHUB_ENV"
              echo "  $1: set"
            else
              echo "  $1: absent — artifacts will be unsigned"
            fi
          }
          carry CSC_LINK "$MACOS_CERTIFICATE"
          carry CSC_KEY_PASSWORD "$MACOS_CERTIFICATE_PASSWORD"
          carry APPLE_API_KEY "$APPLE_KEY"
          carry APPLE_API_KEY_ID "$APPLE_KEY_ID"
          carry APPLE_API_ISSUER "$APPLE_ISSUER"
          carry WIN_CSC_LINK "$WINDOWS_CERTIFICATE"
          carry WIN_CSC_KEY_PASSWORD "$WINDOWS_CERTIFICATE_PASSWORD"

      # electron-builder signs when it finds an identity and says so when it
      # does not. Both cases produce a usable artifact rather than a failed
      # job.
      - name: Package
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pnpm -C clients/electron exec electron-builder --win --publish never
          else
            pnpm -C clients/electron exec electron-builder --mac --publish never
          fi

      # **electron-builder skips a missing `extraResources` source in
      # silence** — no warning, exit 0, and a 94 MB installer with no product
      # inside it. That is exactly what shipped: the staged Windows binaries
      # carry `.exe`, the reference did not, and every check that existed
      # passed. So the artifact is now searched for the two binaries rather
      # than trusted to contain them.
      - name: The package must actually contain the product
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            resources="packaging/out/installers/win-unpacked/resources"
            suffix=".exe"
          else
            resources="packaging/out/installers/mac-arm64/EverTranscript.app/Contents/Resources"
            suffix=""
          fi
          missing=0
          for binary in evertranscript evertranscript-summarizer; do
            if [[ -f "$resources/${binary}${suffix}" ]]; then
              echo "  present: ${binary}${suffix}"
            else
              echo "  MISSING: ${binary}${suffix}"
              missing=1
            fi
          done
          if [[ $missing -ne 0 ]]; then
            echo
            echo "what is in $resources:"
            ls -la "$resources" || echo "  (the directory does not exist)"
            echo
            echo "A Client without the Core is a UI for a product that is not"
            echo "there. Check extraResources in clients/electron/package.json"
            echo "against the names the staging step wrote."
            exit 1
          fi

      - name: Checksums
        shell: bash
        run: |
          cd packaging/out/installers
          # The manifests are generated from these rather than hand-edited:
          # a checksum kept by hand is one that will eventually be wrong, and
          # a wrong one in a package manager fails with a message about
          # tampering.
          # Excluding the file being written: `find` enumerates it, the
          # redirect has already created it empty, and the result is a
          # checksums file listing its own hash as the hash of nothing.
          if command -v sha256sum >/dev/null 2>&1; then
            find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + \
              | tr -d '\\' > SHA256SUMS
          else
            find . -maxdepth 1 -type f ! -name SHA256SUMS -exec shasum -a 256 {} + \
              > SHA256SUMS
          fi
          cat SHA256SUMS

      # **Installing the artifact, not just building it.** Every milestone in
      # this project found its real defects by running the real thing, and
      # "the installer builds" is a claim about a file. This runs it: silent
      # install, then the Core is launched from where the installer put it.
      #
      # It is also the only place the Summary sidecar has ever executed on
      # Windows — it cross-compiles, which M3 taught is worth nothing about
      # runtime.
      - name: Install it and run what was installed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem packaging/out/installers/*.exe |
            Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          if (-not $installer) { throw "no installer to install" }
          Write-Host "installing $($installer.Name)"

          # **Marked as downloaded, because that is what an Operator has.**
          # A file built here has never crossed a network and carries none of
          # what Windows attaches to one that has. The macOS half of this was
          # verified for a year by extracting with `unzip`, which does not set
          # `com.apple.quarantine` — and when the real attribute was finally
          # applied, Gatekeeper killed the Core outright (DECISIONS Q47). This
          # is that test's Windows twin: ZoneId=3 is the Internet zone, the
          # mark a browser writes.
          Set-Content -Path "$($installer.FullName):Zone.Identifier" `
            -Value "[ZoneTransfer]`r`nZoneId=3"
          $mark = Get-Content -Path "$($installer.FullName):Zone.Identifier" -ErrorAction SilentlyContinue
          if (-not $mark) { throw "the mark-of-the-web did not stick; this test would prove nothing" }
          Write-Host "installer marked as downloaded from the Internet zone"

          # /S is NSIS's silent flag; the installer is per-user, so this
          # needs no elevation.
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $root = Join-Path $env:LOCALAPPDATA 'Programs\EverTranscript'
          if (-not (Test-Path $root)) { throw "installer wrote nothing to $root" }

          $core = Join-Path $root 'resources\evertranscript.exe'
          $sidecar = Join-Path $root 'resources\evertranscript-summarizer.exe'
          foreach ($binary in @($core, $sidecar)) {
            if (-not (Test-Path $binary)) {
              Write-Host "what the installer wrote to resources:"
              Get-ChildItem (Join-Path $root 'resources') -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.Name)" }
              throw "missing from the install: $binary"
            }
          }

          # Did the mark reach what was installed? On macOS it does, and it
          # is what kills the Core. Reported either way rather than assumed,
          # because "NSIS does not propagate it" is exactly the kind of
          # reasoning this job exists to replace.
          foreach ($binary in @($core, $sidecar)) {
            $inherited = Get-Content -Path "${binary}:Zone.Identifier" -ErrorAction SilentlyContinue
            $name = Split-Path $binary -Leaf
            if ($inherited) {
              Write-Host "  $name carries the mark of the web"
            } else {
              Write-Host "  $name has no mark"
            }
          }

          # The Core must run from where it was installed. A package that
          # ships a binary the OS refuses to launch is a package that
          # installs nothing. If the mark did propagate, this is where
          # Windows would refuse — the way macOS did.
          $version = & $core --version
          Write-Host "installed Core reports: $version"
          if (-not $version) { throw "the installed Core produced no output" }

          # And the sidecar, which has never executed on Windows before.
          # stdin closed means it reads EOF and exits, which is the orphan
          # protection ADR-0031 asks for — so this checks the process starts
          # and leaves rather than hanging.
          # An empty file, because -RedirectStandardInput takes a path and
          # reading it gives the sidecar immediate EOF.
          $empty = New-TemporaryFile
          $exited = Start-Process -FilePath $sidecar `
            -RedirectStandardInput $empty.FullName -PassThru -NoNewWindow
          if (-not $exited.WaitForExit(30000)) {
            $exited.Kill()
            throw "the sidecar did not exit on stdin EOF"
          }
          Write-Host "sidecar started and exited on EOF"

      - uses: actions/upload-artifact@v4
        with:
          name: evertranscript-${{ matrix.os }}
          path: |
            packaging/out/installers/*.zip
            packaging/out/installers/*.exe
            packaging/out/installers/SHA256SUMS
          if-no-files-found: error
