name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Both platforms are a required gate from the first commit: v1 ships macOS
  # and Windows together, and a milestone is not done until both pass
  # (ADR-0025 as amended).
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # M2 ended by discovering that Windows detection had never worked at
      # all while every CI run was green, because the code compiled, linked,
      # and was never called. Diarization is the same shape of risk one
      # milestone later: two ONNX models, an `ort` runtime that ships
      # different binaries per platform, and tensor layouts that fail
      # silently rather than loudly. So the models are fetched and the
      # inference tests actually execute — on both platforms — instead of
      # being skipped into a green tick.
      #
      # 32 MB, pinned by sha256 in `models/registry.rs`. If a checksum ever
      # stops matching, that is a finding and this job should go red.
      - name: Fetch the inference models
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/diarize-models"
          curl -sL --retry 3 --max-time 300 -o "$RUNNER_TEMP/diarize-models/segmentation.onnx" \
            "https://huggingface.co/onnx-community/pyannote-segmentation-3.0/resolve/main/onnx/model.onnx"
          curl -sL --retry 3 --max-time 300 -o "$RUNNER_TEMP/diarize-models/embedding.onnx" \
            "https://huggingface.co/onnx-community/wespeaker-voxceleb-resnet34-LM/resolve/main/onnx/model.onnx"
          # `shasum` is macOS; Git Bash on the Windows runner has
          # `sha256sum` and not the other way round. Found by this job
          # failing on its first run, which is the job doing its job.
          #
          # The leading `tr -d` is not decoration: GNU coreutils escapes its
          # output line with a leading backslash when the filename contains
          # one, and `$RUNNER_TEMP` on Windows is `D:\a\_temp`. So the hash
          # came back as `\057ee...` and compared unequal to itself. Found
          # the same way as the line above it — by running.
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1 | tr -d '\\'
            else
              shasum -a 256 "$1" | cut -d' ' -f1 | tr -d '\\'
            fi
          }
          verify() {
            actual=$(checksum "$1")
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 checksum $actual, expected $2"
              exit 1
            fi
          }
          verify "$RUNNER_TEMP/diarize-models/segmentation.onnx" \
            057ee564753071c0b09b5b611648b50ac188d50846bff5f01e9f7bbf1591ea25
          verify "$RUNNER_TEMP/diarize-models/embedding.onnx" \
            3955447b0499dc9e0a4541a895df08b03c69098eba4e56c02b5603e9f7f4fcbb

          # The Summary model, in the same step so it shares the two
          # hard-won lines above rather than growing a second copy of them.
          #
          # 491 MB, which is the largest thing this job fetches — and it buys
          # the one claim two M4 criteria could not make: that the sidecar
          # loads a model and generates on *this* platform. It cross-compiles
          # for Windows, and M3 established what that is worth about runtime.
          # Size and sha256 are `SUMMARY_DEFAULT` in `models/registry.rs`.
          mkdir -p "$RUNNER_TEMP/summary-model"
          curl -sL --retry 3 --max-time 900 \
            -o "$RUNNER_TEMP/summary-model/summary.gguf" \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          verify "$RUNNER_TEMP/summary-model/summary.gguf" \
            74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db

      # `cargo test --workspace` does **not** produce this. It builds the
      # summarizer's unit-test harness into `deps/` and stops, so the
      # inference test would find no binary beside it. Verified by deleting
      # the file and re-running rather than reasoned about.
      - name: Build the Summary sidecar for the inference test
        run: cargo build -p evertranscript-summarizer

      - name: Tests
        # Windows runs one test at a time. Two reasons, both real: these
        # tests open capture devices, and a runner with no audio hardware is
        # the worst case for doing that concurrently — and when a crash does
        # happen, sixteen threads dying together makes it unattributable,
        # which is exactly the position this repo was in. Serialised, the
        # last test to report is the one that died.
        env:
          EVERTRANSCRIPT_DIARIZE_MODELS: ${{ runner.temp }}/diarize-models
          EVERTRANSCRIPT_SUMMARY_MODEL: ${{ runner.temp }}/summary-model/summary.gguf
        run: cargo test --workspace ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}

      # `cargo test` regenerates the TypeScript bindings and JSON schemas.
      # If they differ from what is committed, the protocol changed without
      # the Client's types changing with it — which is exactly the drift
      # ADR-0028 wants caught at build time rather than at runtime.
      - name: Protocol bindings and schemas are up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- crates/evertranscript-protocol/bindings crates/evertranscript-protocol/schema; then
            echo "::error::Protocol bindings/schemas drifted. Run 'cargo test -p evertranscript-protocol' and commit the result."
            exit 1
          fi

  client:
    name: Electron Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. `clients/electron/package.json` names
      # the version in `packageManager`, and specifying it twice is an error
      # rather than a redundancy — the action refuses with
      # ERR_PNPM_BAD_PM_VERSION. One source of truth, and it is the manifest.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C clients/electron typecheck

      - name: Build
        run: pnpm -C clients/electron build

  attribution:
    name: Ports ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every ported file carries an attribution header and appears in
      # PORTS.md. This checks the cheap half — that files claiming to be
      # ported are listed — so an unrecorded port fails review, not later.
      - name: Every ported file is in the ledger
        shell: bash
        run: |
          missing=0
          while IFS= read -r file; do
            base=$(basename "$file")
            if ! grep -q "$base" PORTS.md; then
              echo "::error file=$file::This file says it was PORTED but is not listed in PORTS.md"
              missing=1
            fi
          done < <(grep -rl "^//! PORTED\|PORTED from" --include='*.rs' crates || true)
          exit $missing
