name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Both platforms are a required gate from the first commit: v1 ships macOS
  # and Windows together, and a milestone is not done until both pass
  # (ADR-0025 as amended).
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # GitHub's default is six hours of silence before a stuck job is reaped.
    # That was a fine default while this job only compiled and ran fast
    # tests; it stopped being one when the job started loading a real model
    # and supervising a child process to do it (Q45). The slowest healthy
    # job observed is 27m30s, so an hour never fires on a cold cache and
    # still turns a wedged run into a red X within the hour.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # M2 ended by discovering that Windows detection had never worked at
      # all while every CI run was green, because the code compiled, linked,
      # and was never called. Diarization is the same shape of risk one
      # milestone later: two ONNX models, an `ort` runtime that ships
      # different binaries per platform, and tensor layouts that fail
      # silently rather than loudly. So the models are fetched and the
      # inference tests actually execute — on both platforms — instead of
      # being skipped into a green tick.
      #
      # 32 MB, pinned by sha256 in `models/registry.rs`. If a checksum ever
      # stops matching, that is a finding and this job should go red.
      # **Cached, keyed on the checksum.** The Summary model went from 491 MB
      # to 2.5 GB; uncached that is the dominant cost of a run on both
      # platforms and a new way for a push to fail. Keying on the sha256 means
      # a changed model is a different key rather than a stale hit — the cache
      # cannot serve the wrong file, because the file's identity *is* the key.
      - name: Cache the inference models
        id: inference-models
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/diarize-models
            ${{ runner.temp }}/summary-model
            ${{ runner.temp }}/whisper-model
          key: models-f6e3fb6c-057ee564-3955447b-3055274469

      - name: Fetch the inference models
        if: steps.inference-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/diarize-models"
          curl -sL --retry 3 --max-time 300 -o "$RUNNER_TEMP/diarize-models/segmentation.onnx" \
            "https://huggingface.co/onnx-community/pyannote-segmentation-3.0/resolve/main/onnx/model.onnx"
          curl -sL --retry 3 --max-time 300 -o "$RUNNER_TEMP/diarize-models/embedding.onnx" \
            "https://huggingface.co/onnx-community/wespeaker-voxceleb-resnet34-LM/resolve/main/onnx/model.onnx"
          # `shasum` is macOS; Git Bash on the Windows runner has
          # `sha256sum` and not the other way round. Found by this job
          # failing on its first run, which is the job doing its job.
          #
          # The leading `tr -d` is not decoration: GNU coreutils escapes its
          # output line with a leading backslash when the filename contains
          # one, and `$RUNNER_TEMP` on Windows is `D:\a\_temp`. So the hash
          # came back as `\057ee...` and compared unequal to itself. Found
          # the same way as the line above it — by running.
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1 | tr -d '\\'
            else
              shasum -a 256 "$1" | cut -d' ' -f1 | tr -d '\\'
            fi
          }
          verify() {
            actual=$(checksum "$1")
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 checksum $actual, expected $2"
              exit 1
            fi
          }
          verify "$RUNNER_TEMP/diarize-models/segmentation.onnx" \
            057ee564753071c0b09b5b611648b50ac188d50846bff5f01e9f7bbf1591ea25
          verify "$RUNNER_TEMP/diarize-models/embedding.onnx" \
            3955447b0499dc9e0a4541a895df08b03c69098eba4e56c02b5603e9f7f4fcbb

          # The Summary model, in the same step so it shares the two
          # hard-won lines above rather than growing a second copy of them.
          #
          # 491 MB, which is the largest thing this job fetches — and it buys
          # the one claim two M4 criteria could not make: that the sidecar
          # loads a model and generates on *this* platform. It cross-compiles
          # for Windows, and M3 established what that is worth about runtime.
          # Size and sha256 are `SUMMARY_DEFAULT` in `models/registry.rs`.
          mkdir -p "$RUNNER_TEMP/summary-model"
          curl -sL --retry 3 --max-time 900 \
            -o "$RUNNER_TEMP/summary-model/summary.gguf" \
            "https://huggingface.co/unsloth/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-UD-Q4_K_XL.gguf"
          verify "$RUNNER_TEMP/summary-model/summary.gguf" \
            f6e3fb6c2cdc869d16e66c719e94f2c02095d195967230e759a2d77fe814c71f

          # The transcription model. 874 MB, the largest thing here, and it
          # buys the PRD's *top* named unverified risk: whisper.cpp quality
          # on the Operator's actual languages. That risk has been measured
          # exactly once, by hand, in M1 — `transcription_quality.rs` has
          # skipped on every CI run since, on both platforms, because
          # nothing set EVERTRANSCRIPT_TEST_MODEL. Six tests reporting `ok`
          # in 0.00s is what that looks like from outside.
          #
          # **Verified by crc32, not sha256**, because `WHISPER_DEFAULT` in
          # `models/registry.rs` carries `sha256: None` and `crc32:
          # Some(3_055_274_469)`. Checking a number the registry does not
          # hold would mean inventing a second source of truth for the same
          # artifact; this checks the one it does hold, and the size beside
          # it. Python is the only crc32 both runners agree on — macOS
          # `cksum` uses a different polynomial and GNU `cksum -a crc32` is
          # not on the macOS runner at all.
          # One line on purpose: this is inside a YAML block scalar, and a
          # Python script indented to satisfy the block is a Python syntax
          # error while an unindented one ends the block. `reduce` over a
          # chunked `iter` keeps it to a single statement and still streams
          # the file rather than reading 874 MB into memory.
          PY=$(command -v python3 || command -v python || true)
          if [ -z "$PY" ] || ! "$PY" -c "import zlib" >/dev/null 2>&1; then
            echo "::error::no usable python for the crc32 check (found: ${PY:-none})"
            exit 1
          fi
          crc32() {
            "$PY" -c "import zlib,sys,functools;f=open(sys.argv[1],'rb');print(functools.reduce(lambda h,c: zlib.crc32(c,h), iter(lambda: f.read(1<<20), b''), 0) & 0xffffffff)" "$1"
          }
          mkdir -p "$RUNNER_TEMP/whisper-model"
          curl -sL --retry 3 --max-time 1800 \
            -o "$RUNNER_TEMP/whisper-model/whisper.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q8_0.bin"
          actual_size=$(wc -c < "$RUNNER_TEMP/whisper-model/whisper.bin" | tr -d ' ')
          if [ "$actual_size" != "874188075" ]; then
            echo "::error::whisper model is $actual_size bytes, expected 874188075"
            exit 1
          fi
          actual_crc=$(crc32 "$RUNNER_TEMP/whisper-model/whisper.bin")
          if [ "$actual_crc" != "3055274469" ]; then
            echo "::error::whisper model crc32 $actual_crc, expected 3055274469"
            exit 1
          fi

      # `cargo test --workspace` does **not** produce this. It builds the
      # summarizer's unit-test harness into `deps/` and stops, so the
      # inference test would find no binary beside it. Verified by deleting
      # the file and re-running rather than reasoned about.
      - name: Build the Summary sidecar for the inference test
        run: cargo build -p evertranscript-summarizer

      - name: Tests
        # **Windows runs one test at a time.** Two reasons, both real: these tests open capture
        # devices, and a runner with no audio hardware is the worst case for
        # doing that concurrently — and when a crash does happen, sixteen
        # threads dying together makes it unattributable, which is exactly the
        # position this repo was in.
        #
        # macOS does not, and serialising it made things worse rather than
        # better: cargo already runs test *binaries* one after another, so the
        # contention was never across the suite — it was two tests inside one
        # binary each loading a 2.5 GB model. Serialising everything traded a
        # 10-minute binary for a 28-minute one and still ran out. The fix
        # belongs where the contention is, and lives in the test itself.
        #
        # Tighter than the job's hour because this is the step with the
        # unbounded work in it: the only one that runs a real model, with
        # two long poles — `meeting_lifecycle` at 452 s and
        # `summary_inference` at 339 s on macOS, where llama.cpp takes the
        # Metal path and spends most of that compiling pipelines rather than
        # decoding. The step was observed at 16m and 21m51s with a 0.5B, and
        # 45 minutes held until the registered model became a 4B — at which
        # point it timed out, because each test binary paid its own load of a
        # model five times the size. Two things changed rather than only the
        # number: each binary now loads once and reuses it, and the *quality*
        # measurement runs on one platform, since how good a model is does not
        # vary by the machine measuring it. Failing here still names the step
        # instead of cancelling the job out from under it.
        timeout-minutes: 55
        env:
          EVERTRANSCRIPT_DIARIZE_MODELS: ${{ runner.temp }}/diarize-models
          EVERTRANSCRIPT_SUMMARY_MODEL: ${{ runner.temp }}/summary-model/summary.gguf
          EVERTRANSCRIPT_TEST_MODEL: ${{ runner.temp }}/whisper-model/whisper.bin
          # One platform: the model's quality is a property of the model.
          # Whether it *runs* on each platform is a different question, and
          # `summary_inference` answers that one everywhere.
          EVERTRANSCRIPT_MEASURE_SUMMARY_QUALITY:
            ${{ runner.os == 'macOS' && '1' || '' }}
        # `--nocapture` because the WER and CER are the deliverable and
        # cargo swallows a passing test's stdout. Without it this job would
        # download 874 MB, transcribe four fixtures, and print the numbers
        # into a buffer nobody reads — paying the whole cost of the
        # measurement for none of its value. The same flag is what makes the
        # Summary sidecar name the model it loaded.
        run: cargo test --workspace -- --nocapture ${{ runner.os == 'Windows' && '--test-threads=1' || '' }}

      # `cargo test` regenerates the TypeScript bindings and JSON schemas.
      # If they differ from what is committed, the protocol changed without
      # the Client's types changing with it — which is exactly the drift
      # ADR-0028 wants caught at build time rather than at runtime.
      - name: Protocol bindings and schemas are up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- crates/evertranscript-protocol/bindings crates/evertranscript-protocol/schema; then
            echo "::error::Protocol bindings/schemas drifted. Run 'cargo test -p evertranscript-protocol' and commit the result."
            exit 1
          fi

  client:
    name: Electron Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. `clients/electron/package.json` names
      # the version in `packageManager`, and specifying it twice is an error
      # rather than a redundancy — the action refuses with
      # ERR_PNPM_BAD_PM_VERSION. One source of truth, and it is the manifest.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C clients/electron typecheck

      # The main process is not only typechecked. `locateCore` decides
      # whether a packaged Client can find the Core it shipped with, and it
      # shipped wrong once already (Q44) because nothing here ran it.
      - name: Tests
        run: pnpm -C clients/electron test

      - name: Build
        run: pnpm -C clients/electron build

  attribution:
    name: Ports ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every ported file carries an attribution header and appears in
      # PORTS.md. This checks the cheap half — that files claiming to be
      # ported are listed — so an unrecorded port fails review, not later.
      - name: Every ported file is in the ledger
        shell: bash
        run: |
          missing=0
          while IFS= read -r file; do
            base=$(basename "$file")
            if ! grep -q "$base" PORTS.md; then
              echo "::error file=$file::This file says it was PORTED but is not listed in PORTS.md"
              missing=1
            fi
          done < <(grep -rl "^//! PORTED\|PORTED from" --include='*.rs' crates || true)
          exit $missing
