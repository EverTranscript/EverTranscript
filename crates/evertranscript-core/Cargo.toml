[package]
name = "evertranscript-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The EverTranscript Core: detection, capture, transcription, and the record's only writer."

[dependencies]
evertranscript-protocol.workspace = true

anyhow.workspace = true
chrono.workspace = true
cpal.workspace = true
crc32fast.workspace = true
ebur128.workspace = true
dirs.workspace = true
futures-util.workspace = true
hanconv.workspace = true
reqwest.workspace = true
rubato.workspace = true
rusqlite.workspace = true
sha2.workspace = true
whisper-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
async-trait = "0.1.92"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Apple Silicon has a GPU worth using: on CPU, large-v3-turbo decodes a
# 30 s window in ~10 s, so a live meeting outruns the transcriber and the
# capture channel starts dropping frames.
whisper-rs = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-audio.workspace = true
objc2-core-graphics.workspace = true
objc2-core-audio-types.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
# Calendar arming (ADR-0036), and nothing else. `default-features = false`
# is load-bearing rather than tidy: the default set pulls MapKit and
# CoreLocation, and a product whose whole claim is that it processes no
# input it was not handed must not link a location framework. The guarantee
# suite is what noticed.
objc2-event-kit = { version = "0.3.2", default-features = false, features = [
    "EKEventStore",
    "EKEvent",
    "EKCalendarItem",
    "EKTypes",
    "EKObject",
    "EKCalendar",
    "EKParticipant",
] }

[dev-dependencies]
evertranscript-fixtures = { path = "../evertranscript-fixtures" }
hound = "3"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
