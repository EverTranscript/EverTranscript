[workspace]
members = [
    "crates/evertranscript",
    "crates/evertranscript-core",
    "crates/evertranscript-fixtures",
    "crates/evertranscript-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/EverTranscript/EverTranscript"
rust-version = "1.90"

[workspace.dependencies]
evertranscript-core = { path = "crates/evertranscript-core" }
evertranscript-protocol = { path = "crates/evertranscript-protocol" }

anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
cpal = "0.15"
crc32fast = "1"
ebur128 = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "http2",
] }
rubato = "0.16"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
# Metal on Apple Silicon; CPU elsewhere until the Windows GPU story lands.
whisper-rs = { version = "0.16", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "signal",
    "process",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }

# System-audio capture on macOS: CoreAudio process taps (14.4+). Deliberately
# *not* ScreenCaptureKit — that route would demand the Screen Recording
# permission for audio we can take with the narrower one (ADR-0027), and the
# guarantee suite fails the build if ScreenCaptureKit ever gets linked.
[workspace.dependencies.objc2]
version = "0.6"

[workspace.dependencies.objc2-foundation]
version = "0.3"
features = ["NSString", "NSArray", "NSValue", "NSUUID", "NSDictionary"]

[workspace.dependencies.objc2-core-audio]
version = "0.3"
features = ["objc2", "objc2-foundation", "objc2-core-audio-types", "AudioHardware"]

[workspace.dependencies.objc2-core-audio-types]
version = "0.3"
features = ["CoreAudioBaseTypes"]

[workspace.dependencies.objc2-core-foundation]
version = "0.3"
features = ["CFDictionary", "CFString", "CFNumber", "CFBase"]

[profile.release]
lto = "thin"
strip = true
