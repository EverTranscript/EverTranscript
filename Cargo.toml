[workspace]
members = [
    "crates/evertranscript",
    "crates/evertranscript-core",
    "crates/evertranscript-fixtures",
    "crates/evertranscript-protocol",
    # ADR-0031's local Summary engine, in its own process. A separate
    # workspace member rather than a module: the point of the process
    # boundary is that llama.cpp cannot take the Core down with it, and a
    # boundary that shares a binary is not one.
    "crates/evertranscript-summarizer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/EverTranscript/EverTranscript"

[workspace.dependencies]
evertranscript-core = { path = "crates/evertranscript-core" }
evertranscript-protocol = { path = "crates/evertranscript-protocol" }

anyhow = "1"
# The OS credential store: macOS Keychain, Windows Credential Manager.
# Story 41 says API keys live there and nowhere else, so this is the only
# thing in the workspace that ever holds a secret.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# ONNX Runtime, for Diarization's two models (ADR-0029 named it; the AEC
# ended up not needing it, so this is where it actually arrives).
ort = "2.0.0-rc.10"
# Reading a finished Meeting's audio back for post-meeting work. Pure Rust
# and cross-platform on purpose: the alternative is AVFoundation on one
# platform and Media Foundation on the other, which is two decoders to be
# wrong in two different ways.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
cpal = "0.15"
crc32fast = "1"
ebur128 = "0.1"
futures-util = "0.3"
# Han script conversion, by phrase rather than by character so the
# ambiguous direction is safe. MIT. It pulls `ahash` and, under that,
# `getrandom`/`libc` — none of which reach the network, which is the
# property that matters here (ADR-0002).
hanconv = "0.5"
# Windows detection only: audio-session enumeration for per-process
# microphone attribution (ADR-0030, the ship gate). An inline table, so it
# does not end the `[workspace.dependencies]` section it sits in.
windows = { version = "0.62", features = [
    "ApplicationModel_Appointments",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_Packaging_Appx",
] }
windows-future = "0.3"

reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "http2",
    "json",
    # The cloud Summary Backend runs on a blocking worker, not the async
    # runtime: a ninety-minute meeting can take minutes to summarize, and
    # that must not sit on the executor the Core answers Clients from.
    "blocking",
] }
rubato = "0.16"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
# CPU by default; Apple Silicon adds the `metal` feature in
# evertranscript-core, where the target can actually be tested for.
whisper-rs = { version = "0.16", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "signal",
    "process",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }

# System-audio capture on macOS: CoreAudio process taps (14.4+). Deliberately
# *not* ScreenCaptureKit — that route would demand the Screen Recording
# permission for audio we can take with the narrower one (ADR-0027), and the
# guarantee suite fails the build if ScreenCaptureKit ever gets linked.
[workspace.dependencies.objc2]
version = "0.6"

[workspace.dependencies.objc2-foundation]
version = "0.3"
features = ["NSString", "NSArray", "NSValue", "NSUUID", "NSDictionary", "NSTimer", "NSDate", "NSThread", "NSRunLoop", "NSData"]

[workspace.dependencies.objc2-core-audio]
version = "0.3"
features = ["objc2", "objc2-foundation", "objc2-core-audio-types", "AudioHardware"]

[workspace.dependencies.objc2-core-audio-types]
version = "0.3"
features = ["CoreAudioBaseTypes"]

# The menu bar item (ADR-0023). AppKit only — the guarantee suite still
# fails the build if ScreenCaptureKit, EventKit or Contacts appear.
[workspace.dependencies.objc2-app-kit]
version = "0.3"
features = [
    "NSApplication",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSControl",
    "NSView",
    "NSButton",
    "NSEvent",
    "NSGraphicsContext",
    # The menu bar glyph: a template NSImage decoded from bytes embedded in
    # the binary, because the Core has no bundle to load resources from.
    "NSImage",
    "NSImageRep",
]

# Used for one call: does this process have a window server to draw in?
[workspace.dependencies.objc2-core-graphics]
version = "0.3"
features = ["CGSession"]

[workspace.dependencies.objc2-core-foundation]
version = "0.3"
features = ["CFDictionary", "CFString", "CFNumber", "CFBase"]

[profile.release]
lto = "thin"
strip = true
